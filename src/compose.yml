services:
  db:
    env_file:
      - .env
    image: postgres:15.3-alpine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    command: ["python", "-u", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ../downloads:/app/downloads
      - ../data:/app/data
      - ./staticfiles:/staticfiles
    depends_on:
      - db


volumes:
  db_data: